[package]
name = "tinyeasings"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "All 30 easings.net curves for f32 and f64, with runtime curve selection"
license = "CC0-1.0"
repository = "https://github.com/varnholt/tinyeasings"
readme = "README.md"
keywords = ["easing", "animation", "interpolation", "gamedev"]
include = ["src/**", "examples/**", "tests/**", "tools/**", "Cargo.toml", "README.md", "LICENSE"]

[lints.rust]
unsafe_code = "forbid"
